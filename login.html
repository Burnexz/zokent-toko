<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - Zokent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <main class="w-full max-w-sm bg-white rounded-2xl shadow p-6">
    <h1 class="text-xl font-bold text-slate-800">Zokent</h1>
    <p class="text-sm text-slate-500 mb-6">Masuk untuk owner atau kasir</p>

    <form id="form-login" class="space-y-4" novalidate>
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input id="email" type="email" autocomplete="username" required
          class="w-full rounded-lg border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input id="password" type="password" autocomplete="current-password" required
          class="w-full rounded-lg border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <p id="pesan-error" class="text-sm text-red-600 hidden" role="alert"></p>
      <button id="tombol" type="submit"
        class="w-full rounded-lg bg-emerald-600 text-white font-semibold py-3 text-base hover:bg-emerald-700 disabled:opacity-60">
        Masuk
      </button>
    </form>

    <a href="./toko/index.html" class="block text-center text-sm text-slate-500 mt-6 hover:underline">Kembali ke toko</a>
  </main>

  <script type="module">
    import { login, getSesi, getProfil, halamanUntukPeran } from './js/supabase-client.js';

    const form = document.getElementById('form-login');
    const tombol = document.getElementById('tombol');
    const pesanError = document.getElementById('pesan-error');

    function tampilError(teks) {
      pesanError.textContent = teks;
      pesanError.classList.remove('hidden');
    }

    // Jika sudah login dan akun aktif, langsung arahkan sesuai peran.
    (async () => {
      try {
        const sesi = await getSesi();
        if (!sesi) return;
        const profil = await getProfil(sesi.user.id);
        if (profil && profil.is_active) {
          window.location.replace(halamanUntukPeran(profil.role));
        }
      } catch (err) {
        console.error('Cek sesi awal gagal:', err);
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      pesanError.classList.add('hidden');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        tampilError('Email dan password wajib diisi.');
        return;
      }

      tombol.disabled = true;
      tombol.textContent = 'Memproses...';
      try {
        const hasil = await login(email, password);
        if (!hasil.ok) {
          tampilError(hasil.pesan);
          return;
        }
        window.location.replace(halamanUntukPeran(hasil.profil.role));
      } catch (err) {
        console.error(err);
        tampilError('Terjadi kesalahan. Coba lagi.');
      } finally {
        tombol.disabled = false;
        tombol.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
